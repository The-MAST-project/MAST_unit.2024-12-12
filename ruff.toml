# Ruff configuration for MAST_unit.
#
# Mirrors the MAST fleet standard so every repo formats identically. The ruff
# version is pinned in requirements-dev.txt (ruff==0.16.0); config alone is not
# enough — formatter output can differ between ruff versions.
#
# Migrated from pyproject.toml [tool.ruff] (that file held only ruff config).
# `extend-select` moved to [lint] (its top-level location is deprecated).

line-length = 125
target-version = "py312"

# MAST_common is no longer checked out inside this repo (it was the src/common
# submodule; it is now a sibling clone, <top>/common/), so there is nothing here
# to exclude. Keep this file scoped to this repo's own sources.

[lint]
# Enable rules from common linters.
extend-select = [
    "F",   # Pyflakes (runtime errors)
    "E",   # pycodestyle (formatting)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "TID", # tidy imports
]
# Optionally ignore some rules:
# ignore = ["E501"]  # example: disable line-length enforcement

[lint.isort]
# `common` is MAST_common, our own shared library -- first-party, grouped with
# the local modules (acquirer, covers, PlaneWave, ...). Without this, ruff's
# resolver splits the package: bare `from common import asi` lands in the
# first-party block while `from common.activities import ...` is treated as
# third-party, so every isort run reshuffles the import block and the next
# person reverts it. It also no longer lives under this repo at all (it is a
# sibling clone), so ruff's path-based resolver could not classify it correctly
# even in principle -- naming it here is the only reliable way.
known-first-party = ["common"]

[format]
# Ruff's Black-compatible formatter.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
