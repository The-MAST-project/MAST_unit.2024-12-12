# Ruff configuration for MAST_unit.
#
# Mirrors the MAST fleet standard so every repo formats identically. The ruff
# version is pinned in requirements-dev.txt (ruff==0.16.0); config alone is not
# enough — formatter output can differ between ruff versions.
#
# Migrated from pyproject.toml [tool.ruff] (that file held only ruff config); the
# rule list moved to [lint], its top-level location being deprecated.

line-length = 125
target-version = "py312"

# Code we did not write and do not maintain. Excluded rather than fixed: a lint fix in
# a vendor file becomes a merge conflict at the next drop, and the findings are not
# ours to answer for. This keeps `ruff format` off them too, so they stay diffable
# against the supplier's original.
#
# src/Standa is absent from this list only because .gitignore already names it and ruff
# respects that -- same intent, different mechanism.
#
# Listed file by file rather than by directory: src/PlaneWave also holds our own
# ps3cli_locate.py and ps3cli_server.py, which should stay linted.
extend-exclude = [
    # PlaneWave-supplied clients and their demo/startup helpers.
    "src/PlaneWave/pwi4_client.py",
    "src/PlaneWave/pwi4_client_demo.py",
    "src/PlaneWave/pwi4_build_model.py",
    "src/PlaneWave/pwi4_startup.py",
    "src/PlaneWave/ps3cli_client.py",
    "src/PlaneWave/platesolve.py",
    # A dated copy of ps3cli_client.py, superseded but kept for reference.
    "src/PlaneWave/ps3cli_client-2024-08-29.py",
    # Simulator for the retired PlaneWave SHM solving path. Nothing imports it; kept
    # for reference rather than deleted.
    "src/PlateSolveSimulator/PSSImulator.py",
]

# MAST_common is no longer checked out inside this repo (it was the src/common
# submodule; it is now a sibling clone, <top>/common/), so there is nothing here
# to exclude. Keep this file scoped to this repo's own sources.

[lint]
# The fleet's rule set, stated as `select` rather than `extend-select`: ruff's own
# defaults have grown over time (0.16 enables ASYNC, TRY, S, PYI, RUF, LOG, PLR, C4
# and TC on top of the historical E4/E7/E9/F), so `extend-select` meant the effective
# rule set changed with the pinned version rather than with a decision -- 53 of the 75
# findings on `main` came from families nobody had adopted. Pinning it here is the same
# concern this file's header raises about the formatter.
#
# Findings those defaults surfaced are not discarded: #191 is the one real question
# among them, and #172 records the disposition of the rest.
select = [
    "F",   # Pyflakes (runtime errors)
    "E",   # pycodestyle (formatting)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "TID", # tidy imports
]
# No `ignore`. MAST_common needs `ignore = ["N999"]` because its repo root IS the
# `common` package, so the module path walks up into CI's `MAST_common` checkout
# directory and the uppercase makes it invalid. This repo has no root `__init__.py`,
# so the chain stops at `src/` and N999 never fires -- verified under a CI-named
# directory.

[lint.mccabe]
# A ratchet, not a preference. The default is 10; this is the complexity of the worst
# function in the tree (`solvers/astrometry_dot_net.py: parse_solver_output`), so
# anything more tangled than what is already here fails. The other two over the default
# are `phd2/phd2.py: start_exposure` and `imaging/stage_geometry.py:
# find_spec_stage_position`, both at 11; each one fixed lowers this number in the same
# PR. #172 carries the list.
max-complexity = 17

[lint.isort]
# `common` is MAST_common, our own shared library -- first-party, grouped with
# the local modules (acquirer, covers, PlaneWave, ...). Without this, ruff's
# resolver splits the package: bare `from common import asi` lands in the
# first-party block while `from common.activities import ...` is treated as
# third-party, so every isort run reshuffles the import block and the next
# person reverts it. It also no longer lives under this repo at all (it is a
# sibling clone), so ruff's path-based resolver could not classify it correctly
# even in principle -- naming it here is the only reliable way.
known-first-party = ["common"]

[format]
# Ruff's Black-compatible formatter.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
