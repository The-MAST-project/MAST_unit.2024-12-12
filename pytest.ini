[pytest]
# Only tests/ is collected by a bare `pytest`, matching CI. Without this, pytest
# searched the whole repo and imported src/imagers/test_ascom_camera.py -- a
# hardware script that dispatches an ASCOM camera at import -- and hung.
# Machine-dependent suites (src/solvers/tests: astrometry.net, index files, a
# 90 MB frame) are run by naming them explicitly.
testpaths = tests
