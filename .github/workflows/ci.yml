# Continuous integration for MAST_unit.
#
# Windows only: the units are Windows machines, the imager backends bind to
# pywin32/ASCOM, and tests/test_imager_backend_imports.py skips itself off Windows.
# (MAST_common is matrixed over Windows and Linux because it runs on both; MAST_spec
# would be Windows, MAST_control and MAST_gui Linux. Darwin is development only.)
#
# The interesting part is the layout. This repo dropped the src/common submodule
# (#94): `common` is now a SIBLING clone, put on sys.path by the mast.pth that
# MAST_provisioning writes into each machine's venv. So the workflow reproduces that
# layout -- two checkouts side by side, with the workspace root on PYTHONPATH -- rather
# than initialising a submodule that no longer exists.
#
#   <workspace>/
#     common/   <- MAST_common master; the repo root IS the `common` package
#     unit/     <- this repo
#
# Which MAST_common it builds against: the branch of the SAME NAME if one exists there,
# otherwise master (#208). A change spanning both repos is developed on same-named
# branches -- `eli/exclude-region` in each -- and CI then builds the pair as a pair,
# rather than testing the unit half against a master that does not carry the other half
# yet. Before this, such a PR could not go green without a hand-written commit pinning
# `ref:` to the paired branch, which then had to be remembered and deleted before the
# merge. That was paid three times.
#
# A PR STACKED on a pairing branch is a known gap, and an accepted one: it is resolved by
# its OWN name, which has no counterpart, so it builds against master and goes red if its
# base needs unlanded MAST_common. That red is honest -- such a change is not independently
# landable -- and the real signal comes once the base merges. Resolving the base branch too
# was written and rejected as machinery for a rare case (2026-09-18); if stacking becomes
# common, revisit.
#
# Off a pairing branch -- and on every push to main, which asks for a branch MAST_common
# does not have -- this still builds against master. So a breaking change there turns
# this red without anything in this repo having moved, which is the point: that is
# exactly how the units are deployed.
#
# Lint is BLOCKING, and green as of 2026-08-30 (#172). It was red from the day CI
# landed -- 269 findings and 44 unformatted files on 2026-08-09, still 75 findings on
# 2026-08-18 -- deliberately, so the debt showed as red rather than sitting in an
# advisory step nobody reads. Now that it passes, a red lint means a regression.
#
# What it enforces is pinned in ruff.toml: ten rule families under `select` (not
# `extend-select`, which was letting ruff's own widening defaults set the rule set),
# and a C901 ratchet at the tree's worst function.
#
# It is a separate job from the tests so the two signals stay independent: a red lint
# does not hide whether the suite passed, and vice versa. Lint runs on Linux because
# ruff is platform-independent and the Linux runner is quicker to start; the tests are
# what need Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Check out MAST_unit
        uses: actions/checkout@v7
        with:
          path: unit

      - name: Resolve the paired MAST_common branch
        id: common-ref
        shell: bash
        env:
          # head_ref on a pull_request, ref_name on a push. `git ls-remote` rather than
          # the API: both repos are public, so it needs no token, and it is the same
          # question asked of the same server.
          PAIRED: ${{ github.head_ref || github.ref_name }}
        run: |
          remote=https://github.com/The-MAST-project/MAST_common.git
          if [ -n "$PAIRED" ] && [ -n "$(git ls-remote --heads "$remote" "$PAIRED")" ]; then
            echo "ref=$PAIRED" >> "$GITHUB_OUTPUT"
            echo "MAST_common: building against the paired branch '$PAIRED'"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
            echo "MAST_common: no branch named '$PAIRED'; building against master"
          fi

      - name: Check out MAST_common as a sibling
        uses: actions/checkout@v7
        with:
          repository: The-MAST-project/MAST_common
          ref: ${{ steps.common-ref.outputs.ref }}
          path: common

      - uses: actions/setup-python@v7
        with:
          # ruff.toml sets target-version = "py312"; keep these in step.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            unit/requirements.txt
            unit/requirements-dev.txt

      - name: Install dependencies
        working-directory: unit
        # requirements.txt already pins everything the common import chain needs, so
        # there is nothing to install from the sibling checkout.
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt

      - name: Tests
        working-directory: unit
        env:
          # Stands in for the mast.pth the provisioning writes into the venv: it is what
          # makes `import common` resolve to the sibling clone. tests/conftest.py adds
          # src/ on top of this.
          PYTHONPATH: ${{ github.workspace }}
        # -ra surfaces skips: test_imager_backend_imports.py guards on win32com, and a
        # skip there would mean pywin32 failed to install rather than that the test is
        # inapplicable -- on a Windows runner it must actually run.
        run: python -m pytest tests/ -q -ra

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        # requirements-dev.txt pins the version, so CI and every workstation agree on
        # what counts as a finding. Nothing else is needed: ruff never imports the code.
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Format
        # Deliberately before `ruff check`: this one is a single `ruff format .` away,
        # so surfacing it first means the cheap half of the debt is not hidden behind
        # the expensive half.
        run: ruff format --check .

      - name: Lint
        run: ruff check .
