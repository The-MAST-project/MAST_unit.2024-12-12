[tool.ruff]
line-length = 125
target-version = "py312"

# Enable rules from common linters
extend-select = [
    "F",   # Pyflakes (runtime errors)
    "E",   # pycodestyle (formatting)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "TID", # tidy imports
]

# Optionally ignore some rules
# ignore = ["E501"]  # example: disable line length enforcement

# Automatically fix on save (when VS Code is configured)
fix = true

[tool.ruff.format]
# Use Ruff's Black-compatible formatter
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
# Show unused `noqa` directives as errors
# warn-unused-ignores = true
