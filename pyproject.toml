# pytest configuration for MAST_unit.
#
# This file used to carry the ruff config as well. That moved to ruff.toml on
# main (commit 53e5de3, "chore(ruff): migrate config to ruff.toml"), which also
# gained `extend-exclude = ["src/common"]` so the MAST_common submodule is not
# formatted from here. Do not re-add a [tool.ruff] section -- ruff.toml owns it,
# and two sources would drift.

[tool.pytest.ini_options]
# `pythonpath` (not a conftest sys.path hack) because the app is run as
# `cd src; python app.py` -- src IS the import root, so tests import
# `calibration.calibrator`, exactly as the running code does.
pythonpath = ["src"]
testpaths = ["tests"]

# Hardware and the config DB are NOT available in a plain checkout, so the
# default run must stay pure: anything touching a mount, camera, focuser or
# MongoDB is marked and deselected here, and opted into explicitly with
#   pytest -m hardware      /  pytest -m db
addopts = "-m 'not hardware and not db'"
markers = [
    "hardware: needs a live unit (mount/camera/focuser/stage)",
    "db: needs a reachable config database",
]
