[tool.pytest.ini_options]
# `pythonpath` (not a conftest sys.path hack) because the app is run as
# `cd src; python app.py` -- src IS the import root, so tests import
# `calibration.calibrator`, exactly as the running code does.
pythonpath = ["src"]
testpaths = ["tests"]

# Hardware and the config DB are NOT available in a plain checkout, so the
# default run must stay pure: anything touching a mount, camera, focuser or
# MongoDB is marked and deselected here, and opted into explicitly with
#   pytest -m hardware      /  pytest -m db
addopts = "-m 'not hardware and not db'"
markers = [
    "hardware: needs a live unit (mount/camera/focuser/stage)",
    "db: needs a reachable config database",
]

[tool.ruff]
line-length = 125
target-version = "py312"

# Enable rules from common linters
extend-select = [
    "F",   # Pyflakes (runtime errors)
    "E",   # pycodestyle (formatting)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "TID", # tidy imports
]

# Optionally ignore some rules
# ignore = ["E501"]  # example: disable line length enforcement

# Automatically fix on save (when VS Code is configured)
fix = true

[tool.ruff.format]
# Use Ruff's Black-compatible formatter
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
# Show unused `noqa` directives as errors
# warn-unused-ignores = true
